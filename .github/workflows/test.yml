name: APIx CI - Automated Test Suite

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'pipeline/**'
      - 'scraper/**'
      - 'lib/**'
      - 'types/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    branches:
      - main

concurrency:
  group: apix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Verify Next.js Production Build
        run: npm run build
